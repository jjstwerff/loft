#
# PKG.REG R3.5 — post-merge signing workflow.
#
# Drop this file at `.github/workflows/sign-and-commit.yml` in the
# `loft-lang/registry` repo.  Runs after every successful merge to
# `main`: re-signs `index.json` with the maintainer Ed25519 key and
# commits `index.json.sig` back to `main`.
#
# Secrets required:
#   REGISTRY_SIGNING_KEY_BASE64 — base64-encoded 32-byte private key
#     (stored as a repo secret in loft-lang/registry settings).
#
# The signing step uses a tiny python script `tools/sign-index.py`
# (next to validate.py).  Implementation sketch:
#
#   import base64, sys, pathlib
#   from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
#   key_bytes = base64.b64decode(sys.argv[1])
#   private_key = Ed25519PrivateKey.from_private_bytes(key_bytes)
#   content = pathlib.Path("index.json").read_bytes()
#   sig = private_key.sign(content)
#   pathlib.Path("index.json.sig").write_bytes(sig)

name: Sign index

on:
  push:
    branches: [main]
    paths:
      - "index.json"

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signing dep
        run: pip install cryptography

      - name: Sign index.json
        env:
          KEY_B64: ${{ secrets.REGISTRY_SIGNING_KEY_BASE64 }}
        run: python3 tools/sign-index.py "$KEY_B64"

      - name: Commit signature
        run: |
          if git diff --quiet -- index.json.sig; then
            echo "Signature unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "loft-registry-bot"
          git config user.email "registry-bot@loft-lang.org"
          git add index.json.sig
          git commit -m "sign: regenerate index.json.sig after $(git rev-parse --short HEAD~)"
          git push
