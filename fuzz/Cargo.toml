[package]
name = "loft-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.loft]
path = ".."
# @PLN53 F1 — exposes `loft::fuzz_oracle` for the `program_source` target.
features = ["fuzzing"]

# Keep loft's internal debug validators (Store::fl_validate + the record-count
# consistency assert) live in the fuzz build — a free in-tree oracle on top of
# ASan.  cargo-fuzz builds in release, so opt them in explicitly.
[profile.release]
debug-assertions = true
overflow-checks = true

[[bin]]
name = "store_alloc"
path = "fuzz_targets/store_alloc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vector_collection"
path = "fuzz_targets/vector_collection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "program_ownership"
path = "fuzz_targets/program_ownership.rs"
test = false
doc = false
bench = false

[[bin]]
name = "program_source"
path = "fuzz_targets/program_source.rs"
test = false
doc = false
bench = false
