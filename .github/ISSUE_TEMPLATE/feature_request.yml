name: Feature request
description: Propose an addition or change to the language, standard library, or tooling.
title: "[feature] "
labels: ["enhancement", "status:unclear"]
body:
  - type: markdown
    attributes:
      value: |
        loft tracks design decisions in `doc/claude/`.  Before
        opening a feature request, it helps to skim
        [`PLANNING.md`](https://github.com/loft-lang/loft/blob/main/doc/claude/PLANNING.md),
        [`ROADMAP.md`](https://github.com/loft-lang/loft/blob/main/doc/claude/ROADMAP.md),
        and [`DESIGN_DECISIONS.md`](https://github.com/loft-lang/loft/blob/main/doc/claude/DESIGN_DECISIONS.md)
        — the last one lists features that have been considered and
        explicitly declined, with reasoning.

        An enhancement is well-formed once two things are clear: **what works
        now** and **what you want from us**.  We then triage the *cost* (effort,
        systems we'd change, risks) and decide — implement, defer, or reject.
        (Lifecycle: `doc/claude/ISSUE_TRACKING.md` § Item lifecycle.)

  - type: textarea
    id: problem
    attributes:
      label: What works now (and where it falls short)
      description: What can you do today for this, and how does it fall short?  Include the current workaround, if any.  Concrete is better than abstract.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you want from us
      description: The capability you want — what becomes possible that isn't today.  A code example of how you'd use it helps a lot.
      render: rust
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, in or out of loft.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links to similar features in other languages, prior discussions, etc.
