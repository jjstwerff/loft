name: Feature request
description: Propose an addition or change to the language, standard library, or tooling.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        loft tracks design decisions in `doc/claude/`.  Before
        opening a feature request, it helps to skim
        [`PLANNING.md`](https://github.com/jjstwerff/loft/blob/main/doc/claude/PLANNING.md),
        [`ROADMAP.md`](https://github.com/jjstwerff/loft/blob/main/doc/claude/ROADMAP.md),
        and [`DESIGN_DECISIONS.md`](https://github.com/jjstwerff/loft/blob/main/doc/claude/DESIGN_DECISIONS.md)
        — the last one lists features that have been considered and
        explicitly declined, with reasoning.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What were you trying to do when you wished loft had this feature?  Concrete is better than abstract.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the feature look like in loft?  A code example helps a lot.
      render: rust
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, in or out of loft.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links to similar features in other languages, prior discussions, etc.
