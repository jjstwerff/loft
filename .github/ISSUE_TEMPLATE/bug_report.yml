name: Bug report
description: Something the loft compiler, interpreter, or runtime got wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.  A small repro is
        worth far more than a description — the smaller the program
        that reproduces the problem, the faster the fix.

        **Our promise: your working program keeps working.**  If an
        upgrade broke something that used to work, that is a top-priority
        **regression**, not a "managed change" or a "known limitation" —
        say so plainly and we treat it as a bug.  And **every report gets
        a response** — it is acknowledged and labelled, never left to
        vanish.

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducer
      description: A `.loft` program (or shell command) that triggers the bug.  Inline if short, otherwise a gist / paste link.
      render: rust
      placeholder: |
        fn main() {
            x = [1, 2, 3]
            println("{x.len}")
        }
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you thought would happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened.  Include the full error / panic / wrong output.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: loft version
      description: Output of `loft --version`.  If from `git`, the commit hash.
      placeholder: "0.8.4 (or commit abc1234)"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      description: Which path were you using when the bug occurred?
      multiple: true
      options:
        - "--interpret (default)"
        - "--native"
        - "--native-debug"
        - "browser (WASM)"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Linux x86_64 / macOS arm64 / Windows / Firefox 124 / ..."
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: A way to avoid the bug today — or what you tried that did NOT work.  Drives triage urgency.
      render: rust
      placeholder: |
        Bind the concat to a local first:  w = v + [9]; w.len()
        — or: "none clean — rebinding via a temp also fails (...)"

  - type: dropdown
    id: workaround_quality
    attributes:
      label: Is there a clean workaround?
      description: Sets the `wa:*` label.  A bug with no clean workaround is often more urgent than its raw severity implies.
      options:
        - "wa:clean — a simple, idiomatic alternative exists"
        - "wa:partial — a workaround exists but it's awkward / loses the intended behaviour"
        - "wa:none — nothing works; this blocks whoever hits it"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: found_via
    attributes:
      label: Filed as a direct result of another ticket?
      description: >-
        If this was found BECAUSE of another ticket — a follow-on of that investigation, a
        sibling the matrix turned up, a defect in the fix — put `Found-via: #N` here.  It does
        NOT change `hit-by:*`, which stays a direct pointer to whoever ran into THIS one; it
        records the chain, so "what set us looking" can be derived by walking it.  Leave blank
        if nothing prompted it.
      placeholder: "Found-via: #747"
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Sets the `sev:*` label — how bad is it WHEN you hit it?
      options:
        - "sev:high — crash / memory corruption / data loss / a soundness hole (silently wrong)"
        - "sev:medium — wrong result / hang / miscompile in a real shape, but no corruption"
        - "sev:low — cosmetic / a rare edge / a false-positive warning / a confusing diagnostic"
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Area(s)
      description: Sets the `area:*` label(s) — which part of loft?  Pick one or more.
      options:
        - label: "area:parser — lexer / two-pass parser / type resolution / scope"
        - label: "area:codegen — bytecode or native code generation"
        - label: "area:store-lifetime — heap alloc/free, deps, value-semantic lifetime"
        - label: "area:closures — fn-refs, lambdas, captured cells"
        - label: "area:runtime — executing bytecode (interpreter)"
        - label: "area:native — the --native backend specifically"
        - label: "area:wasm — the browser / WASM target"
        - label: "area:stdlib — the standard library (default/*.loft)"
        - label: "area:packages — package format, registry, use resolution"

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else — links to related issues, screenshots, what you tried.
