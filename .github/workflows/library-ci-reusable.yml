#
# library-ci-reusable — the ONE library CI gate, called by every loft-lang/loft-libs-*
# repo.  Replaces the per-repo copies of library-ci.yml, which had drifted (stale
# `jjstwerff/loft` checkout URL in 5 of 6 repos, an incomplete package matrix in
# some, and no CI at all in loft-libs-docs).  A lib repo's own workflow becomes a
# ~10-line caller passing its package list; the build logic + the loft URL live
# here, so they stay in lockstep across all libraries.
#
# Called as:
#   jobs:
#     ci:
#       uses: loft-lang/loft/.github/workflows/library-ci-reusable.yml@main
#       with:
#         packages: '["shapes","gridmesh"]'
name: library-ci-reusable

on:
  workflow_call:
    inputs:
      packages:
        description: 'JSON array of package dirs in the repo, e.g. ["shapes","gridmesh"]'
        required: true
        type: string
      loft-ref:
        description: 'loft ref to build + validate against (default: main)'
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                       # one broken package must not hide the others
      matrix:
        package: ${{ fromJson(inputs.packages) }}
    name: ${{ matrix.package }}
    steps:
      - name: Checkout the library
        uses: actions/checkout@v4

      - name: Install mold (loft's pinned linker)
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Checkout loft (loft-lang/loft — the current org URL)
        uses: actions/checkout@v4
        with:
          repository: loft-lang/loft          # was `jjstwerff/loft` in the drifted copies
          ref: ${{ inputs.loft-ref }}
          path: loft-src

      - name: Cache cargo + loft build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            loft-src/target
          key: library-ci-loft-${{ inputs.loft-ref }}-${{ hashFiles('loft-src/Cargo.lock') }}
          restore-keys: library-ci-loft-

      - name: Build loft
        working-directory: loft-src
        run: |
          cargo build --release --lib --bin loft
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # System libraries the package's native crate links against, declared as
      # `build-deps` in loft.toml (graphics → libgl-dev, libasound2-dev).  Needed on
      # BOTH gates: the cdylib is built even under --interpret, because #native fns
      # are called through it.
      #
      # The package's OWN loft.toml is not enough.  `input` declares no build-deps
      # yet depends on `graphics`, whose cdylib is what actually needs GL/ALSA — so
      # a scan of the package alone leaves it red for a reason its manifest never
      # mentions.  Resolving the deps first and scanning THEIR manifests too makes
      # this correct for the whole tree without hard-coding a package list.
      - name: Install system build-deps (this package and its resolved deps)
        working-directory: ${{ matrix.package }}
        run: |
          set -u
          loft install > /dev/null 2>&1 || true      # populate ~/.loft/registry for the scan
          # DISCOVERY is best-effort: "nothing found" is an ordinary answer, not a
          # failure.  GitHub runs this with `bash -e`, so every component's exit
          # status matters, and on a normal package THREE of them are non-zero —
          # the registry glob matches nothing (`cat` → 1) when a package has no
          # deps, and a filter that removes every line (`grep -v` → 1) when nobody
          # declares build-deps.  Under `pipefail` any one of those killed the step,
          # which is what reddened seven of the eight adoption PRs.  So: no
          # pipefail, `sed` instead of `grep`, and `|| true` on the whole thing.
          # apt-get below still fails loudly — that one IS a real error.
          deps=$( { sed -n 's/^ *build-deps *= *"\(.*\)"/\1/p' loft.toml 2>/dev/null
                    cat ~/.loft/registry/*/loft.toml 2>/dev/null \
                      | sed -n 's/^ *build-deps *= *"\(.*\)"/\1/p'
                  } | tr ',' '\n' | tr -d ' ' | sed '/^$/d' | sort -u | tr '\n' ' ') || true
          if [ -n "$deps" ]; then
            echo "installing build-deps: $deps"
            sudo apt-get install -y $deps
          else
            echo "no build-deps declared by this package or its deps"
          fi

      # A library's OWN CI denies warnings on its own code by default (a package may
      # opt out with a `.allow_warnings` file in its dir) — distinct from the loft-side
      # revalidate-libs gate, which tolerates warnings (a new loft warning must not fail
      # an already-shipped lib).
      #
      # LOFT_STORE_GUARD arms loft's own store-lifetime checks on the library's code
      # while its tests run: the Goal-E reclaim assertion (a store the model calls dead
      # but that outlives a later allocation — a hard failure) plus the advisory
      # confinement report on stderr.  It costs no new test and needs no consumer, so a
      # brand-new package passes it on day one.  Verified across all 25 published
      # packages on both backends before it was turned on: zero failures, one advisory
      # note (`cbor`).
      # Both legs below report WHY they failed into the run summary, not only into
      # their own job log.
      #
      # `fail-fast: false` above already keeps every package's verdict — but the run
      # page then shows N red dots and nothing else, so telling two failures apart
      # means opening two logs and scrolling each.  That is the difference between
      # "regex and random are red" and the actionable version: regex is two
      # `shadowed-by-method` warnings on free functions no bare call can reach, while
      # random is one `never-read` variable in a test file.  Same colour, unrelated
      # work, and the summary is what says so at a glance.
      #
      # The gated lines are the ones a reader acts on — `FAIL` (which file, and the
      # gate that rejected it), `Warning[...]` (what `--deny-warnings` tripped on) and
      # `error`.  Capped, because a summary that dumps a whole log is a log.
      - name: Interpret — ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        env:
          LOFT_DENY_WARNINGS: ${{ hashFiles(format('{0}/.allow_warnings', matrix.package)) != '' && '0' || '1' }}
          LOFT_STORE_GUARD: 1
        run: |
          set -o pipefail
          loft --interpret --tests tests 2>&1 | tee "$RUNNER_TEMP/interpret.log" && exit 0
          status=$?
          {
            echo "### ❌ \`${{ matrix.package }}\` — interpret"
            echo
            echo '```'
            grep -E '^[[:space:]]*(FAIL|Warning\[|error)' "$RUNNER_TEMP/interpret.log" | head -40 \
              || echo "(no FAIL/Warning line — see the job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Native — ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        env:
          LOFT_DENY_WARNINGS: ${{ hashFiles(format('{0}/.allow_warnings', matrix.package)) != '' && '0' || '1' }}
          LOFT_STORE_GUARD: 1
        run: |
          set -o pipefail
          LOFT_TIMEOUT=240 loft --native --tests tests 2>&1 | tee "$RUNNER_TEMP/native.log" && exit 0
          status=$?
          {
            echo "### ❌ \`${{ matrix.package }}\` — native"
            echo
            echo '```'
            grep -E '^[[:space:]]*(FAIL|Warning\[|error)' "$RUNNER_TEMP/native.log" | head -40 \
              || echo "(no FAIL/Warning line — see the job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Worked-example citations resolve (@PLN141) — the SAME shared gate loft runs on
      # its own tree, pointed at this package.  Every `// Example: @AAA-###` on a fn must
      # resolve to exactly one `// @AAA-###`-tagged fn in the repo the acronym names
      # (dangling / duplicate / unregistered = drift, red).  The logic + the acronym
      # registry live in loft-src, so all libraries share ONE gate — no per-repo copy to
      # drift.  Vacuously green for a package with no citations, so it is safe on every
      # library from day one and only begins gating once the package opts in by authoring
      # a citation.  REPO_ROOT is the library checkout; the acronym resolves in place.
      # Two checks, vacuously green until the package authors tags:
      #   examples       — every `// Example: @AAA-###` citation resolves to a tagged fn
      #   examples-index — the committed examples-index.tsv (tag -> file:line -> blob link)
      #                    is current.
      #
      # ⚠ ADVISORY HERE, GATING INSIDE LOFT — and that asymmetry is the point.  These are
      # the only two checks that span repositories: this job runs LOFT's script against
      # THIS library, so the rules arrive from whatever loft `main` happens to be.  It bit
      # in both directions before being tiered: `exindex` landed in loft 2026-08-18 and
      # reddened loft-libs-game's next PR for a file it never touched (last green run
      # 2026-08-17), and switching a library CHECKOUT's branch turned loft's own run red
      # with two dangling tags — a failure with no bad commit in either repo.  A gate whose
      # rules change under you, from a repo you do not control, lands its red on whoever
      # opens the next PR.
      #
      # It follows the repo's own diagnostic rule (CLAUDE.md): a diagnostic gates if and
      # only if ignoring it can produce a WRONG RESULT.  A dangling doc citation is a broken
      # link — it cannot.  So it advises, LOUDLY: the findings go to the job summary in full,
      # the same place a failing test writes its excerpt.  `EXAMPLES_GATE=hard` restores the
      # blocking behaviour for a repo that wants it.
      - name: Worked-example tags resolve — ${{ matrix.package }}
        env:
          EXAMPLES_REPO_ROOT: ${{ github.workspace }}
          EXAMPLES_CITE_ROOTS: ${{ matrix.package }}/src ${{ matrix.package }}/tests
        run: |
          log="$RUNNER_TEMP/examples-${{ matrix.package }}.log"
          bash loft-src/scripts/check_doc_drift.sh examples       2>&1 | tee    "$log"
          bash loft-src/scripts/check_doc_drift.sh examples-index 2>&1 | tee -a "$log"
          # `warning(s)` is the advisory summary line; anything else is clean.  The script
          # exits 0 in this mode, so the summary block is the ONLY signal — which is why it
          # carries the whole finding and the runnable cure, not a pointer to the log.
          if grep -q 'warning(s)' "$log"; then
            {
              echo "### ⚠️ \`${{ matrix.package }}\` — worked-example docs need attention"
              echo
              echo "Advisory: this does **not** fail the build.  It is the documentation gate"
              echo "loft owns, run against this library."
              echo
              echo '```'
              sed -e 's/\x1b\[[0-9;]*m//g' "$log" \
                | grep -vE '^\s*ok( |$)' | grep -vE '^clean \(' | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Library compatibility contract, step 4 — ADVISORY, never gating.
      #
      # Compares this package against a sample of its own published releases: the latest, the
      # declared `api_compatible_with` floor, and one RANDOM release in between.  O(1) per run
      # whatever the history, and the random draw is what makes it mean — a break cannot hide
      # in a version nobody ever looks at.  The draw is printed and can be pinned with
      # LOFT_COMPAT_SAMPLE, so a red reproduces instead of reshuffling into green.
      #
      # GATING, but only for a package that DECLARES `api_compatible_with`.  Declaring a floor
      # is the act of entering the contract: a package that declares nothing has promised
      # nothing, so this stays advisory for it and cannot fail its build.  No published package
      # declares one today, which is what makes turning this into a gate safe — it can only
      # start failing a build after its author opts in.
      #
      # Raising the floor is the supported way to break, and it does NOT buy silence: the
      # sub-floor releases are still compared and reported as a DECLARED BREAK.  Keeping the
      # promise is the quiet path; withdrawing one is the loud path.  Design:
      # doc/claude/plans/library-compat-contract/README.md.
      - name: Compatibility with published releases — ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: loft compat check

      - name: Rust integration tests (if present)
        if: hashFiles(format('{0}/native/tests/*.rs', matrix.package)) != ''
        working-directory: ${{ matrix.package }}/native
        run: cargo test --release

      # Phase 6t Tier 4 — run each declared dependency's own tests against the loft
      # built here.  Catches "we shipped a dep version that breaks this consumer" at
      # the consumer, which is the only place it is visible.  The drifted per-repo
      # copies in graphics/world/game already gated on this; keeping it means the
      # unified workflow is a SUPERSET of every copy it replaces, so adopting it
      # cannot quietly lose coverage a repo already had.
      - name: Transitive dep tests
        working-directory: ${{ matrix.package }}
        run: LOFT_TIMEOUT=240 loft test --deps
