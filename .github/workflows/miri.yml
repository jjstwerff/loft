# @PLAN53 — the nightly UB-sanitizer + toolchain-matrix lever.  Catches the
# "passes today, corrupts tomorrow" failure (the @P383 incident) BEFORE a
# rustc/LLVM bump or an untested path turns latent UB into silent corruption.
#
# Three complementary nightly checks, all too slow / too churny to gate every
# PR (the cheap per-PR companion is the `stack_align_guard` job in ci.yml,
# which covers the alignment class at normal test speed):
#
#   - miri  — gold-standard hard-UB (alignment/OOB/UAF/uninit/leak), but
#     interpreter-on-Miri is ~20 min, so it runs a curated representative set.
#     Runs on BOTH ubuntu-x86_64 and macos-ARM64 (@PLN54 S1 — @P383 was ARM-only).
#   - asan  — AddressSanitizer over the WHOLE interpreter corpus at near-native
#     speed: the broad UAF/OOB sweep Miri's curated set can't afford.  loft's
#     intentional store aliasing lives WITHIN single allocations, so ASan (which
#     checks allocation bounds, not borrow models) runs clean where Miri needs
#     -Zmiri-disable-stacked-borrows.  Leaks off for now (detect_leaks=0) pending
#     triage of the live-at-exit baseline.  Runs on BOTH ubuntu-x86_64 and
#     macos-ARM64 (@PLN54 S1); the ARM leg skips one deep-nesting guard test whose
#     8 MB-stack calibration ASan's frame redzones defeat (see the asan job).
#   - poison — the arena poison-on-free detector (@PLN54 S3): LOFT_POISON=1
#     fills every freed STORE RECORD with 0xDEADBEEF so a dangling-DbRef read
#     after free is loud garbage, not silent stale data.  This is the
#     store-internal use-after-free class Miri/ASan/Valgrind all miss (loft's
#     arena free is not a libc free()), and it runs on STABLE rustc with no
#     sanitizer — so it sweeps the whole interpreter corpus at near-native speed.
#   - tsan  — ThreadSanitizer (@PLN54 S2) over the `par`/`par_light` threading
#     suites: the ONLY data-race coverage.  loft runs real rayon-pool workers
#     over deep-copied per-worker Stores writing disjoint tiled ranges
#     (THREADING.md); TSan confirms that isolation holds under real concurrency
#     (Miri is single-threaded; ASan/guard are not race detectors).  Needs an
#     instrumented std (-Zbuild-std), sanitizer flag target-scoped so host
#     proc-macros stay clean.
#   - native-asan — ASan over the `--native` GENERATED binary (@PLN54 S6): the
#     in-process interpreter ASan job is blind to `--native` (a separate,
#     uninstrumented process).  LOFT_NATIVE_ASAN=1 compiles the generated binary
#     with -Zsanitizer=address so an OOB / UAF store access the codegen emits is
#     caught, not silent.  (S9's mixed-boundary cdylib shares the mechanism —
#     blocked on a proc-macro -L fix; see plans/54-.../NATIVE_ASAN_DESIGN.md.)
#   - debug-asserts — loft's ~200 internal `debug_assert!`s (@PLN54 S5b): the H5
#     numbering law, Store::valid()/addr() bounds, poison/UAF invariants — its OWN
#     correctness contract, compiled OUT of every normal test build
#     ([profile.dev.package.loft]) and previously checked only by cargo-fuzz.
#     `-C debug-assertions=on` runs them over the whole interpreter corpus at
#     near-native speed — the fast, broad complement to Miri's slow curated set.
#   - toolchain-matrix — the suite under beta + nightly rustc, the early-warning
#     for toolchain-sensitivity (the @P383 trigger).  Non-blocking: nightly/beta
#     std/lint churn must never page us.
#
# A regression lands red within ≤24h, always before any (deliberate, never-auto)
# release.
name: Nightly checks (UB sanitizers + toolchain matrix)

on:
  schedule:
    - cron: '0 4 * * *'        # nightly 04:00 UTC
  workflow_dispatch:
  # @CI_BUDGET — the memory-safety gates run PER PR as well as nightly.  The rule
  # is placement by CAUSE: the PR gate tests what THIS DIFF can break, the nightly
  # tests what THE WORLD can break.  UB, a store UAF, a data race, a violated
  # internal invariant — all of those are introduced by a diff, so they must fail
  # on the PR that introduced them, while the author still has the context.
  #
  # They are affordable because they run in PARALLEL with the ~20-minute test legs
  # and every one is well under that ceiling: Miri 1m15s, TSan 2m57s, POISON 3m43s,
  # native-ASan 3m57s, debug-assertions 5m46s, ASan-macOS 10m38s.  Adopting them
  # costs no wall-clock at all.
  #
  # The jobs that stay NIGHTLY-ONLY carry `if: github.event_name != 'pull_request'`
  # below — the leak gate (23-25m, over the ceiling by itself), and everything that
  # measures the world rather than the diff (toolchain drift, library health, doc
  # index, stale plans).  See doc/claude/CI_BUDGET.md.
  pull_request:
    paths:
      - 'src/**'
      - 'default/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/miri.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  stale-plans-audit:
    name: Stale-plan drift audit (informational)
    # Nightly-only: measures the WORLD (or exceeds the 20-min PR ceiling), not this diff — @CI_BUDGET.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full main history for the close-directive grep
      - name: Audit open status:active plans vs main
        # Read-only: lists status:active plans + flags any whose close directive
        # already landed on main (the drift the close-plans workflow would have
        # caught).  PLANS_TOKEN if the plans repo is private; else the default
        # token reads the public repo.  Never fails the run — surfaces a warning.
        env:
          GH_TOKEN: ${{ secrets.PLANS_TOKEN || github.token }}
        run: |
          out=$(scripts/audit-stale-plans.sh 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q DRIFT && \
            echo "::warning::stale plans found — close directive on main but issue still status:active; run scripts/close-shipped-plans.sh" || true

  miri:
    name: Miri hard-UB gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # @PLN54 S1 — the founding @P383 incident surfaced EXCLUSIVELY on macOS-ARM, so
    # the Miri leg runs on both the ubuntu-x86_64 and macos-ARM64 runners; a
    # ubuntu-only nightly would not have caught it.  The store-unit set is
    # platform-agnostic Rust (no mold, no target flag), so both legs share the same
    # steps; `runner.os`-scoped cache keys keep them separate.  `fail-fast: false`
    # so a red leg on one OS never masks the other's result.  Validated on a real
    # Mac before landing (6/6 store-unit tests Miri-clean on aarch64-apple-darwin).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The store-unit set runs in seconds; the whole job is dominated by the Miri
    # sysroot build + the lib compile under Miri (~10-15 min).  30 min is generous
    # headroom AND a fail-fast tripwire: a future test that runs a WHOLE loft
    # program under Miri (interpreter-under-interpreter) blows this in minutes
    # instead of silently hitting the old 90-min cap and cancelling the nightly.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo registry + miri target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/miri
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-miri-

      - name: miri setup (build the Miri sysroot)
        run: cargo +nightly miri setup

      # Curated Miri set — DIRECT Rust unit tests of the unsafe STORE layer (no
      # loft program, no stdlib parse), so each runs in milliseconds under Miri.
      # -Zmiri-disable-stacked-borrows gates the HARD memory-safety UB
      # (alignment/OOB/UAF/uninit/leak), NOT the aliasing MODEL: loft's store layer
      # uses intentional raw-pointer aliasing across distinct records that
      # Stacked/Tree Borrows reject by design.  -Zmiri-disable-isolation lets a test
      # read its `LOFT_*` config.  Grow ONLY with more store-layer unit tests —
      # never a `code!` whole-program test (that reintroduces the timeout).
      #
      # Curated set:
      #   store::tests::coalesce_free_merges…   — free-list coalesce + slot reuse
      #   store::tests::resize_in_place_zeroes… — in-place grow + zero the new region
      #   store::tests::borrow_locked_reads…    — locked (worker) read of original data
      #   database::…::adopt_store_pushes…      — cross-store adopt into parent allocs
      #   database::…::take_slot_returns_owned… — take a worker output slot + sentinel
      #   database::store_rebase_tests::translate_rewrites_mapped — store-rebase walk
      # (The historical @PLAN53 cluster-3/4/5 + P213 UB these replaced is now covered
      #  fast + whole-corpus by the asan / poison / debug-asserts jobs; those
      #  full-program `code!` tests were REMOVED because they timed the job out.)
      #                                         (commit e0e094f7)
      #
      # @PLN54 S5(a) — RE-TARGETED at the unsafe STORE layer.  The old curated set
      # ran WHOLE loft programs (the `issues`/`code!` tests) through the interpreter,
      # which under Miri is interpreter-under-interpreter — each took so long the job
      # hit its 90-min cap and CANCELLED every nightly (the p213 sibling alone timed
      # out at 240s locally).  A timing-out gate protects nothing, so those tests are
      # REMOVED.  The store/unsafe layer that actually carries the UB (claim /
      # free-coalesce / resize+zero / cross-store adopt / store-rebase walk) is
      # reached by DIRECT Rust unit tests over hand-built `Stores` — NO stdlib parse,
      # NO program execution — so Miri checks the exact unsafe code in SECONDS (all
      # six ran ~8s locally, 0 UB).  Interpreter-path UB is covered fast + broad by
      # the `asan` (whole-corpus OOB/UAF), `poison` (store UAF), and `debug-asserts`
      # (loft's ~200 invariants) jobs.  (Deliberately-UB store tests — `*_panics`,
      # `verify_graph_catches_a_dangling_pointer` — are excluded: they create real UB
      # by design, which Miri would correctly flag.)
      - name: Miri hard-UB gate (store/unsafe layer)
        env:
          MIRIFLAGS: '-Zmiri-disable-isolation -Zmiri-disable-stacked-borrows'
        run: |
          cargo +nightly miri test --lib -- --exact \
            store::tests::coalesce_free_merges_adjacent_and_reuses_space \
            store::tests::resize_in_place_zeroes_absorbed_region \
            store::tests::borrow_locked_reads_original_data \
            database::worker_output_slot_tests::adopt_store_pushes_to_parent_allocations \
            database::worker_output_slot_tests::take_slot_returns_owned_store_and_leaves_sentinel \
            database::store_rebase_tests::translate_rewrites_mapped

  asan:
    name: ASan UAF/OOB sweep (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # @PLN54 S1 — run the whole-corpus ASan sweep on BOTH the ubuntu-x86_64 and
    # macos-ARM64 runners.  The founding @P383 incident surfaced only on macOS-ARM,
    # so ARM ASan closes a real residual (a UB that manifests on ARM but not on the
    # ubuntu leg).  `include` carries the per-runner native `target` triple (ASan
    # instruments the whole build only under an explicit --target) and a macOS-only
    # `extra_filter` (see the sweep step).  `fail-fast: false` so one OS's red never
    # hides the other.  Validated on a real Mac before landing (1494 pass / 0 fail
    # + the raw-pointer-OOB positive control fires on arm64).
    # On a PULL REQUEST this runs the macOS leg ONLY.  ci.yml already gates every PR
    # with an ubuntu ASan UAF/OOB job (11m39s), so running the ubuntu leg here too
    # would buy nothing and burn a runner; the macOS-ARM leg is the one a PR has no
    # other coverage for, and it is the leg the founding @P383 incident needed.
    # Nightly keeps both.  (The ARM `extra_filter` note below applies either way.)
    #
    # ASan pads every stack frame with redzones (~6× on ARM here), which defeats the
    # 8 MB-stack calibration of the deep-nesting guard test: 128-deep recursion
    # overflows the thread stack BEFORE the depth guard bails (a pure
    # ASan-instrumentation artifact — production frames are ~10 KB and the guard
    # fires at ~1.3 MB).  It is a functional recursion guard test, not UAF/OOB
    # coverage, and still runs unsanitized on the macOS-ARM full suite
    # (v2-validation.yml) + the ubuntu ASan leg, so skipping it only here loses no
    # memory-safety coverage.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os":"macos-latest","target":"aarch64-apple-darwin","extra_filter":" | test(deep_nesting_in_sandboxed_def_is_a_clean_error_not_a_crash)"}]'
          || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","extra_filter":""},{"os":"macos-latest","target":"aarch64-apple-darwin","extra_filter":" | test(deep_nesting_in_sandboxed_def_is_a_clean_error_not_a_crash)"}]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install mold
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-asan-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-asan-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The interpreter test targets (issues/wrap/strings/frame_vars + lib unit
      # tests) run in-process, so ASan instruments the interpreter itself —
      # native/wasm/html tests spawn separate uninstrumented binaries and add no
      # ASan coverage.  An explicit --target makes RUSTFLAGS instrument the whole
      # build.  detect_leaks=0 keeps this a clean UAF/OOB gate.  The LeakSanitizer
      # baseline is now ROOT-CAUSED (@PLN54 S4, plans/54-.../REMAINING_DESIGN.md § S4):
      # (1) the intentional documented `ir_read` Box::leak of &'static str IR names
      # (interner-style, bounded), and (2) a REAL GROWING production leak — a native
      # fn's `text` result used as a user function's implicit tail-return is never
      # registered as owned (~2 allocs/call, grows; rebinding to a local fixes it;
      # likely a caller-bind/OpReturn owned-placeholder gap in state/codegen.rs).
      # This sweep stays detect_leaks=0 (a clean UAF/OOB gate).  The LEAK half is the
      # SEPARATE `asan-leak-gate` job below (detect_leaks=1, ENFORCING at baseline 0) —
      # split out so the slow single-threaded leak pass never gates this fast sweep,
      # and so a leak regression is its own red signal.
      #
      # nextest (not `cargo test`): it does NOT build doctests, which under
      # `--target` + `-Zsanitizer` fail to resolve the curve25519 proc-macro
      # (E0463).  The filter drops the lib-FFI integration test (needs GL/ALSA
      # build-prep) + the toolchain-sensitive generated-code-freshness meta-tests
      # (they byte-compare a regeneration to a stable-committed file — a build-
      # hygiene check, not memory safety; ci.yml validates them on stable).
      - name: ASan sweep (UAF / OOB; leaks off pending triage)
        env:
          RUSTFLAGS: '-Zsanitizer=address'
          ASAN_OPTIONS: 'detect_leaks=0'
        run: >
          cargo +nightly nextest run --profile ci --release
          --target ${{ matrix.target }}
          --lib --test issues --test wrap --test strings --test frame_vars
          -E 'not (test(library_suite) | test(fill_rs_up_to_date) |
          test(n9_generated_fill_matches_src) |
          test(native_rs_functions_up_to_date)${{ matrix.extra_filter }})'

  # @PLN85 — the interpreter LEAK GATE.  SEPARATE from the ASan UAF/OOB sweep above:
  # its own runner (the slow single-threaded leak pass never gates the fast sweep) and
  # its own red/green signal.  ENFORCING at baseline 0 — a leak FAILS this job so it
  # gets found and fixed.  Non-blocking by construction: it lives only in the nightly
  # workflow, so it never gates a PR / another fix; it just lands red within 24h.
  #
  # detect_leaks=1 + .github/lsan_suppressions.txt (the intentional `ir_read` Box::leak,
  # + the macOS dyld thread-TLS frame — a no-op on Linux).  As of @PLN85 the whole
  # interpreter corpus is leak=0 locally; this job holds it there.  If a NEW benign
  # SYSTEM frame surfaces on the Linux leg (different TLS impl), suppress THAT specific
  # frame in lsan_suppressions.txt — never raise the baseline off zero for a real leak.
  asan-leak-gate:
    name: ASan interpreter leak gate (${{ matrix.os }})
    # Nightly-only: measures the WORLD (or exceeds the 20-min PR ceiling), not this diff — @CI_BUDGET.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extra_filter: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            extra_filter: ' | test(deep_nesting_guard)'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install mold
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-asan-leak-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-asan-leak-cargo-
      # LIBRARY leak coverage needs the native-FFI build deps (GL / ALSA): the
      # library suite exercises the graphics / input / moros libs — the libs are
      # where loft's real use lives, so they MUST be leak-gated too.
      - name: Install lib-FFI build deps (GL/ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgl1-mesa-dev libasound2-dev pkg-config
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # LSan suppressions match by a SYMBOLIZED frame-name substring, and the two legs need
      # DIFFERENT symbolizers — proven on a real macOS box, see doc/claude/plans/macos-asan-leak-gate.md:
      #   * Linux → force llvm-symbolizer.  It DEMANGLES Rust (`loft::fill::append_text`),
      #     which the bare-name suppressions (`leak:append_text`) match.  Runners ship it
      #     only under a versioned name the default PATH lookup misses, so resolve it here.
      #   * macOS → do NOT set ASAN_SYMBOLIZER_PATH; let the runtime fall back to the system
      #     `atos`.  atos leaves Rust MANGLED (`..._4loft4fill11append_text` — still matched
      #     by the bare `append_text` substring) BUT, crucially, it RESOLVES the dyld system
      #     frames (`dyld::ThreadLocalVariables::…`).  llvm-symbolizer leaves those dyld
      #     frames UNSYMBOLIZED, so forcing it on macOS makes the benign thread-TLS class
      #     unsuppressable and reds the gate — the exact failure this replaces.
      # Persists via $GITHUB_ENV to every later step (Linux only; macOS leaves it unset).
      - name: Point the sanitizer at llvm-symbolizer (Linux only; macOS uses atos)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e +o pipefail
          rustup component add llvm-tools-preview >/dev/null 2>&1 || true
          SYM=$(ls "$(rustc --print sysroot 2>/dev/null)"/lib/rustlib/*/bin/llvm-symbolizer 2>/dev/null | head -1)
          [ -z "$SYM" ] && SYM=$(command -v llvm-symbolizer || true)
          [ -z "$SYM" ] && SYM=$(ls /usr/lib/llvm-*/bin/llvm-symbolizer /usr/bin/llvm-symbolizer-* 2>/dev/null | sort -V | tail -1)
          echo "llvm-symbolizer resolved to: ${SYM:-NONE}"
          if [ -n "$SYM" ]; then
            "$SYM" --version | head -1 || true
            echo "ASAN_SYMBOLIZER_PATH=$SYM" >> "$GITHUB_ENV"
          else
            echo "::warning::no llvm-symbolizer found — LSan stacks stay unsymbolized and suppressions may not match"
          fi
      # The leak gate = the ASan sweep's command with detect_leaks=1 instead of 0, so
      # nextest runs each test in its OWN process and LSan fails THAT test at exit if it
      # leaks — per-test attribution (the best "work we might miss" signal), implicit
      # baseline 0.  Includes `library_suite` (dropped from the fast sweep) so a leak in
      # ANY library's interpreted test suite (its spawned `loft test` child inherits
      # detect_leaks=1 and exits non-zero) reds this gate.  Suppressions cover only the
      # intentional `ir_read`/`ir_schema`/`snapshot` Box::leak interner + the macOS dyld
      # thread-TLS class (`ThreadLocalVariables`).  `-Cforce-frame-pointers=yes` is REQUIRED: without it
      # the optimized release build truncates the leak stack at `RawVec::…finish_grow`
      # (frame-pointer unwind stops there), so the interner frame never appears and the
      # name-based suppression cannot match — the benign leak then reds the gate.
      #
      # `library_suite` spawns the `--target`-built loft binary
      # (`CARGO_BIN_EXE_loft`) from a temp cwd, so that binary looks for `default/`
      # next to itself.  Pre-create the release dir + symlink `default/` there so the
      # spawned interpreter can load the stdlib — else every lib test fails "cannot
      # load default library" (the per-file scan below does the same symlink, but too
      # late for the nextest run).
      - name: Symlink default/ for library_suite's spawned loft (ASan build)
        run: |
          mkdir -p "target/${{ matrix.target }}/release"
          ln -sfn "$PWD/default" "target/${{ matrix.target }}/release/default"
      - name: Leak gate (detect_leaks=1, whole corpus incl. libraries)
        env:
          RUSTFLAGS: '-Zsanitizer=address -Cforce-frame-pointers=yes'
          ASAN_OPTIONS: 'detect_leaks=1'
          LSAN_OPTIONS: 'suppressions=${{ github.workspace }}/.github/lsan_suppressions.txt'
        # The fault-path text class (append_text / format_text / format_long / text_tl_fmt)
        # is suppressed in lsan_suppressions.txt — a faulting program never frees its
        # in-flight text local, an accepted non-cleanup on the terminating abort path (the
        # real binary process::exits, so this is never a production leak).  No test is
        # excluded; the deliberately-faulting fixtures now run under the gate too.
        run: >
          cargo +nightly nextest run --profile ci --release --no-fail-fast
          --target ${{ matrix.target }}
          --lib --test issues --test wrap --test strings --test frame_vars
          -E 'not (test(fill_rs_up_to_date) | test(n9_generated_fill_matches_src) |
          test(native_rs_functions_up_to_date)${{ matrix.extra_filter }})'

      # SPECIFIC LOGGING: nextest names the failing TEST, but the `loft_suite` /
      # `library_suite` runners execute the whole `.loft` corpus IN ONE PROCESS, so a
      # leak there names only the runner, not the file.  This scans each script
      # SEPARATELY under the ASan loft binary and emits a `::error file=…::` annotation
      # naming the exact leaking `.loft` + its owner frame.  `if: always()` so it runs
      # (and names names) even after the nextest step already failed the job.
      - name: Build ASan loft binary (for per-file leak scan)
        if: always()
        env:
          RUSTFLAGS: '-Zsanitizer=address -Cforce-frame-pointers=yes'
        run: |
          cargo +nightly build --release --bin loft --target ${{ matrix.target }}
          ln -sfn "$PWD/default" target/${{ matrix.target }}/release/default
      - name: Per-file leak scan (names the exact leaking .loft)
        if: always()
        env:
          LSAN_OPTIONS: 'suppressions=${{ github.workspace }}/.github/lsan_suppressions.txt'
          # Standing aid (macos-asan-leak-gate.md): on a REAL leak, dump the raw ASan report for each
          # leaking file inline, so the next debugger reads the runner's own symbolized stack straight
          # from the log instead of paying a ~40-min re-dispatch to instrument it (that cost settled the
          # nw_context macOS case). Gated on roots>0, so it's completely inert on a green run.
          LOFT_LEAK_DUMP: '1'
        run: >
          ABIN=target/${{ matrix.target }}/release/loft
          bash scripts/asan_leak_scan.sh tests/scripts/*.loft tests/docs/*.loft

  poison:
    name: LOFT_POISON arena-UAF gate (store-internal use-after-free)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-poison-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-poison-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # LOFT_POISON=1 (@PLN54 S3) overwrites every freed store record's payload
      # with 0xDEADBEEF on free, so a dangling-DbRef read AFTER free hits loud,
      # deterministic garbage (an out-of-range store_nr the read guards trip)
      # instead of silent stale data.  This is the store-internal use-after-free
      # blind spot Miri / ASan / Valgrind ALL share: loft's arena "free" is not a
      # libc free(), so a reused arena slot defeats an allocator-bounds checker.
      # It needs NO sanitizer and NO nightly — a single cached env read on stable
      # rustc — so it runs the whole in-process interpreter corpus at near-native
      # speed.  The 23-bug campaign that drove this green (and the freed-stack-slot
      # second half still to build) is in
      # plans/85-store-lifetime-retirement/fuzz-proof-gate.md.
      #
      # Same in-process-interpreter surface as the asan / guard jobs (native /
      # wasm / html tests spawn separate binaries that never reach this free
      # path); library_suite is the native GL/ALSA FFI suite this lean job omits.
      # nextest (not `cargo test`): matches the other sanitizer jobs — skips
      # doctests, emits the JUnit report, and isolates each test in its own
      # process (a cleaner poison signal, no cross-test arena carryover).
      - name: Poison sweep (LOFT_POISON=1, interpreter corpus)
        env:
          LOFT_POISON: '1'
        run: >
          cargo nextest run --profile ci --release
          --lib --test issues --test wrap --test strings --test frame_vars
          -E 'not test(library_suite)'

  tsan:
    name: ThreadSanitizer (par/threading data-race gate)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-tsan-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-tsan-cargo-

      # loft's ONLY data-race surface: `par`/`par_light` run worker closures on a
      # rayon pool, each over a DEEP-COPIED per-worker `Stores` (clone_for_worker),
      # writing NON-OVERLAPPING tiled ranges through a shared raw pointer, joined
      # before the buffer is read (THREADING.md).  ThreadSanitizer is the only tool
      # that checks that isolation holds under real concurrency (Miri runs
      # stacked-borrows-off single-threaded; ASan/`stack_align_guard` are not race
      # detectors) — a clean run CONFIRMS disjointness, any race is real (an
      # overlapping slot, an unsynchronised shared write).  The `threading` +
      # `threading_chars` suites drive real multi-worker `par` over the
      # element-type × thread-count × worker-form matrix.
      #
      # TSan needs an INSTRUMENTED std (`-Zbuild-std`) — unlike ASan, linking the
      # precompiled std ABI-mismatches (`mixing -Zsanitizer`).  The sanitizer flag
      # is TARGET-scoped via `--config` (NOT global RUSTFLAGS), so host
      # proc-macros / build scripts stay unsanitized — else the proc-macro dylibs
      # the compiler dlopen's get `-Zsanitizer` and mismatch.  `cargo test` (not
      # nextest): this exact incantation is what was validated locally, and a
      # positive control (two threads racing one byte in loft's shared-pointer
      # shape) confirmed TSan fires here, so a clean run is non-vacuous.
      - name: TSan sweep (threading suites)
        env:
          TSAN_OPTIONS: 'halt_on_error=0'
        run: >
          cargo +nightly test -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --config 'target.x86_64-unknown-linux-gnu.rustflags=["-Zsanitizer=thread"]'
          --release --no-fail-fast --test threading --test threading_chars

  native-asan:
    name: Native-backend ASan (--native codegen)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Nightly is needed for `-Zsanitizer=address` on the GENERATED native binary,
      # and it must build the runtime rlib TOO — see the build step below for why.
      - name: Install Rust stable + nightly
        uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-native-asan-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-native-asan-cargo-

      # Built with NIGHTLY, the same toolchain the sweep compiles the generated crate
      # with.  An rlib is SVH-locked to one rustc, so the generated crate can only
      # `extern crate loft` against an rlib built by the SAME compiler: the job used to
      # build the rlib on stable and compile against it on nightly, which worked only
      # while the two rustcs happened to agree on crate metadata.  They stopped —
      # stable 1.97.1 vs nightly 1.99.0 — and every run failed `E0514: found crate
      # `loft` compiled by an incompatible version of rustc`, on any diff.  A toolchain
      # roll must not be able to redden a gate that exists to catch codegen bugs.
      #
      # (loft's own auto-rebuild does not save this, and the reason is loft#706: its
      # staleness check compares the rustc that built the loft BINARY with the current
      # one, not the rustc that built the RLIB it is about to link.  Those are the same
      # build normally, so when they diverge loft sees nothing to do and hands rustc an
      # incompatible rlib.  Build them together and the question never arises.)
      - name: Build loft host binary + runtime rlib
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo build --release --bin loft --lib

      # @PLN54 S6 — loft's `--native` codegen emits Rust that accesses the store by
      # raw pointer; a codegen bug producing an out-of-bounds / use-after-free store
      # access runs SILENT today because `--native` is a separate, uninstrumented
      # process the in-process interpreter `asan` job cannot see.  LOFT_NATIVE_ASAN=1
      # makes loft compile the generated binary with `-Zsanitizer=address` (nightly),
      # so that class is caught.  ASan tolerates linking the generated crate against
      # the uninstrumented libloft.rlib (no -Zbuild-std needed, unlike TSan).  The
      # curated corpus is the store-heavy shapes (vectors/structs/enums/collections/
      # text/match) + the 131/132 UAF regression scripts — the exact class ASan
      # catches.  detect_leaks=0: the interpreter has known live-at-exit allocations
      # (S4 owns that triage).  Validated locally + a raw-pointer-OOB positive control
      # confirms ASan fires here.  (S9's mixed-boundary cdylib ASan shares this
      # mechanism but is blocked on a proc-macro `-L` fix — NATIVE_ASAN_DESIGN.md.)
      - name: Native ASan sweep (curated --native corpus)
        env:
          LOFT_NATIVE_ASAN: '1'
          RUSTUP_TOOLCHAIN: nightly
          ASAN_OPTIONS: 'detect_leaks=0'
        run: |
          set -euo pipefail
          for s in 01-integers 02-floats 03-text 04-booleans 05-enums 06-structs \
                   10-match 11-vectors 12-collections 13-map-filter-reduce \
                   124-vector-amortised-growth 131-keyed-nested-struct-uaf \
                   132-vector-elemset-inline-literal-uaf 138-vector-of-vector-single; do
            echo "::group::--native ASan $s"
            ./target/release/loft --native "tests/scripts/$s.loft"
            echo "::endgroup::"
          done

  debug-asserts:
    name: Debug-assertions gate (loft's internal invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-da-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-da-cargo-

      # loft carries ~200 internal `debug_assert!`s — the H5 pass-numbering law,
      # `Store::valid()` / `addr()` bounds, the poison/UAF invariants — that encode
      # its OWN correctness contract (distinct from Rust-level UB the sanitizers
      # check).  `[profile.dev.package.loft]` compiles them OUT of every normal
      # dev/test build, so until now NOTHING in CI checked them except cargo-fuzz.
      # `-C debug-assertions=on` turns them on across the interpreter corpus at
      # near-native speed — catching an invariant regression the moment it lands,
      # far more coverage per CI-minute than growing the slow Miri set (@PLN54 S5).
      # Scope MATCHES the per-PR `stack_align_guard` sweep in ci.yml: the in-process
      # interpreter test binaries, `library_suite` excluded (it builds the lib/*
      # NATIVE cdylibs + needs GL/ALSA this lean job omits, and DA asserts fire in
      # the in-process compile+run, not the spawned native binary).  The wrap/strings
      # DA-tripwire chain (the plan85 DA-inventory worklist) was cleared on
      # `tuxedo-cluster-c`, so the gate now spans the same corpus the alignment sweep
      # does.  Non-vacuous: the asserts are proven to fire (the @PLN85 DA campaign
      # closed a 53→0 failed-target inventory of real bugs by turning them on).
      # `LOFT_STORE_GUARD=1` (Goal E) additionally runs the block-confinement
      # detector (`store_lifetime_guard`) across this corpus — its enforced twin,
      # the `reclaim_guard` `assert_eq!`, already hard-gates here via
      # `cfg(debug_assertions)`.  Closes the "the env var is set in no workflow"
      # gap; verified silent corpus-wide.
      - name: Debug-assertions sweep (interpreter corpus)
        env:
          RUSTFLAGS: '-C debug-assertions=on'
          LOFT_STORE_GUARD: '1'
        run: >
          cargo test --release --no-fail-fast
          --lib --test issues --test wrap --test strings --test frame_vars
          -- --skip library_suite

  toolchain-matrix:
    name: Suite under ${{ matrix.toolchain }}
    # Nightly-only: measures the WORLD (or exceeds the 20-min PR ceiling), not this diff — @CI_BUDGET.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Full interpreter suite under beta + nightly — an early-warning signal for
    # std / lint / toolchain churn.  `fail-fast: false` so BOTH legs run to
    # completion (we want the whole picture, not the first failure).  NOT
    # `continue-on-error`: a real break must surface as a red nightly we can
    # inspect and act on — `continue-on-error` hid failures behind a green
    # overall (a scheduled run reported success while `library_suite` was
    # broken).  Nothing gates on the nightly, so a red here never blocks.
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-${{ matrix.toolchain }}-cargo-

      # Interpreter test targets only — the core where UB lives and where a
      # toolchain change is most likely to surface it.  Skips the heavy
      # native/wasm build-prep an early-warning check doesn't need.  Also skips
      # the generated-code-freshness meta-tests (fill.rs / native fns): those
      # byte-compare a regeneration to the committed copy and are toolchain-
      # sensitive by construction (a build-hygiene check ci.yml runs on stable),
      # so they would red-flag the matrix on a non-runtime concern.
      # `--skip library_suite`: same exclusion (and rationale) as ci.yml's
      # stack_align guard job — it builds the lib/* NATIVE suites
      # (graphics/moros_*/input FFI), whose build scripts need the GL/ALSA
      # system packages this lean job does not install.  Every nightly from
      # early June 2026 was red on `pkg_config::Error` in
      # `build_script_build` for exactly this, drowning the real
      # toolchain-churn signal the matrix exists to catch.
      - name: Test (ubuntu, ${{ matrix.toolchain }})
        run: >
          cargo +${{ matrix.toolchain }} test --release --no-fail-fast
          --lib --test issues --test wrap --test strings --test frame_vars
          -- --skip fill_rs_up_to_date --skip n9_generated_fill_matches_src
          --skip native_rs_functions_up_to_date --skip library_suite

      # The toolchain matrix compiles GENERATED Rust in the OS temp dir; when
      # a leg fails, that generated source is the diagnosis and is otherwise
      # lost with the runner.
      - name: Upload generated sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-native-src-${{ matrix.toolchain }}
          path: |
            /tmp/loft_native_*.rs
            /tmp/loft_*_test.rs
          if-no-files-found: ignore
          retention-days: 14

  # Doc-index hygiene (plan-37) — the authoritative DAILY catch.  The per-PR
  # `index-hygiene` job in ci.yml is advisory (non-blocking), so a broken
  # `@`-tag / markdown link can land on `main`; this nightly run surfaces it
  # within a day.  Same single-binary check, on stable.
  index-hygiene:
    name: doc index hygiene (nightly)
    # Nightly-only: measures the WORLD (or exceeds the 20-min PR ceiling), not this diff — @CI_BUDGET.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-hygiene-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-hygiene-cargo-
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # `make index` runs `target/release/loft --native-release` (it exits 1
      # with "host loft binary missing" otherwise), and that native compile
      # links `target/release/libloft.rlib` — so build BOTH the binary and the
      # canonical lib.  This job previously relied on a CACHED binary and so
      # failed `make index` whenever the cache missed cold (a latent bug the
      # run_id cache-key change exposed, NOT the rpc-ghost); building it
      # explicitly makes the leg cache-independent.
      - name: Build host loft binary + lib (required by `make index`)
        run: cargo build --release --lib --bin loft
      - name: Index hygiene (broken @-tags + markdown links)
        run: cargo nextest run --profile ci -E 'binary(index_hygiene)'

      # This leg failed intermittently (June 2026) with `crate::rpc`
      # unrewritten in a generated `/tmp/loft_native_<pid>.rs` — a shape that
      # does not reproduce locally and whose failing artefact was lost with
      # the runner every time.  Preserve it so the next occurrence is
      # diagnosable instead of folklore.
      - name: Upload generated sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: index-hygiene-generated-src
          path: /tmp/loft_native_*.rs
          if-no-files-found: ignore
          retention-days: 14

  library-health:
    name: Library health audit (informational)
    # Nightly-only: measures the WORLD (or exceeds the 20-min PR ceiling), not this diff — @CI_BUDGET.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 75, not 30: @PLN20 P6 adds the NATIVE tier below, which compiles every published
    # package with rustc.  The interpreter step keeps its own fast signal regardless —
    # see the two-step split there.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-libaudit-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-libaudit-cargo-
      - name: Library health audit (correctness + drift + orphaned branches)
        # Read-only across the loft-libs-* repos: lib_audit builds loft, then per
        # library checks interpreter correctness + registry currency + stray
        # branches (unmerged-no-PR orphans / prunable).  Informational — never
        # fails the nightly; surfaces a warning + job summary so branch hygiene and
        # library drift are caught routinely, not only on a manual run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(scripts/lib_audit.sh --no-native 2>&1 || true)
          echo "$out"
          { echo '## interpreter tier'; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$out" | grep -q "NOT GREEN" && \
            echo "::warning::library audit not green — orphaned branches / drift / correctness (see job summary)" || true

      # @PLN20 P6 / open question 3 — the NATIVE tier, nightly only.
      #
      # `mold` is loft's pinned linker; `libasound2-dev` provides the ALSA headers
      # `alsa-sys` (a transitive native dep of `graphics`' `rodio`) builds against;
      # `xvfb` + `libgl1-mesa-dri` give a headless software GL.  Without them the
      # graphics/input legs fail at native CRATE build and read as library rot —
      # a B-class false alarm, which is worse than no native tier at all.  Same
      # provisioning as registry-validation.yml, for the same reason.
      - name: Install native toolchain deps (mold + ALSA + headless GL)
        run: sudo apt-get update -y && sudo apt-get install -y mold libasound2-dev xvfb libgl1-mesa-dri
      - name: Library health audit — native tier
        # A SECOND step rather than dropping `--no-native` above: native compiles are
        # the slow, fragile part, and the interpreter sweep is the signal we already
        # rely on.  Splitting them means a native overrun can never cost us the
        # interpreter verdict, which one combined step would.
        #
        # Bounded at 45m and an overrun is REPORTED, never silently truncated: a
        # sweep that was cut short is INCOMPLETE, not green, and saying so is the
        # whole point of a taxonomy that refuses to collapse into a silent pass.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(timeout 45m scripts/lib_audit.sh 2>&1); then rc=0; else rc=$?; fi
          echo "$out"
          { echo '## native tier'; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 124 ]; then
            echo "::warning::library audit NATIVE tier hit the 45m bound and was cut short — the sweep is INCOMPLETE, not green"
          elif echo "$out" | grep -q "NOT GREEN"; then
            echo "::warning::library audit (native) not green — see job summary"
          fi

  # @PLN54 S7 — the nightly's own smoke alarm.  Nothing gates on this workflow, and
  # `continue-on-error` / `fail-fast: false` legs keep the OVERALL run green even
  # when a matrix leg is red — so a real regression can sit unnoticed for days.
  # This job reads per-JOB conclusions (not the run status) and opens/updates ONE
  # deduped GitHub issue on any red gate, so a week of red nightlies is a single
  # tracked issue, not seven (and auto-resolves it when the gates go green again).
  notify:
    name: Nightly gate failure → tracked issue
    # An automatic ISSUE is an interruption, so it is reserved for the case that
    # actually warrants one: **the language itself is unsound**.  These four say
    # exactly that — hard UB, a store use-after-free, an out-of-bounds/UAF access,
    # or a violated internal invariant — and every one of them now also gates each
    # PR, so a red here means something got past the PR gate, which is precisely
    # when a human should be pulled in.
    #
    # Everything else (toolchain drift, doc index, library health, the leak
    # baseline) reports in the `daily-status` summary below and files NOTHING.  A
    # jq crash in a matrix selector became issue #638 under the old any-red rule;
    # that is noise, and noise is what makes a real alert ignorable.
    #
    # The dedup/auto-close contract is unchanged, and the old warning still holds
    # for THIS list: a gate absent from `needs` is invisible here, and its silence
    # reads as green and AUTO-CLOSES the issue.  When you add a gate that means
    # "the language is broken", add it here in the same commit.
    needs: [miri, asan, poison, debug-asserts]
    # Never from a PR: a pull request must not be able to open an issue on the repo.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open / update / close the deduped failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no `actions/checkout` — it only talks to the API — so `gh` has no
          # git remote to infer the repo from and every call below died with
          # `fatal: not a git repository`.  The job then failed INSTEAD of filing, so
          # nightly failures went unrecorded (verified: no open `nightly-failure` issue
          # despite red nightlies on 07-18, 07-19 and 07-20).  `GH_REPO` gives every `gh`
          # call the context in one line, without paying for a checkout.
          #
          # Note what the failure mode was: this job is the one that NOTICES a gate going
          # red, and it was the thing silently not working — the same shape the comment
          # above warns about for the gates themselves.
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Per-JOB conclusions from the needs context.  Anything that is not `success`
          # counts — NOT an allowlist of bad values.  `needs.<job>.result` is one of
          # success / failure / cancelled / skipped, and a gate that was CANCELLED or
          # SKIPPED did not prove anything: treating it as green is how a gate stops
          # gating without ever going red.  Inverting also self-heals if GitHub adds a
          # result value.  (Every job in `needs` is a gate; informational jobs are excluded.)
          failed=$(printf '%s' "$RESULTS" | jq -r '
            to_entries[] | select(.value.result != "success") | .key' \
            | paste -sd, - || true)
          # Idempotent dedup label; find any OPEN prior issue.
          gh label create nightly-failure --color b60205 \
            --description "Auto-filed nightly UB/sanitizer gate failure" --force >/dev/null 2>&1 || true
          existing=$(gh issue list --state open --label nightly-failure \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$failed" ]; then
            echo "all watched nightly gates green"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "✅ Nightly gates green again as of $RUN_URL — closing." || true
              gh issue close "$existing" --reason completed || true
            fi
            exit 0
          fi
          echo "::warning::nightly gate(s) not green: $failed"
          body=$(printf 'Nightly UB/sanitizer gate(s) did not pass: **%s**\n\nRun: %s\n\nFiled from per-JOB conclusions — anything that is not `success` counts, including `cancelled` and `skipped` (a gate that did not RUN proved nothing). The overall run can read green while a matrix leg is red. This issue auto-updates on repeat failures and auto-closes when every watched gate is green.' "$failed" "$RUN_URL")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "updated existing issue #$existing"
          else
            gh issue create --title "Nightly UB/sanitizer gate failure" \
              --label nightly-failure --body "$body"
            echo "opened a new tracking issue"
          fi

  # ── The one place to look ────────────────────────────────────────────────────
  #
  # A red nightly used to be UNDIFFERENTIATED: `registry-validation` was dead for
  # six nights on a jq crash, and that looked exactly like the five nights before
  # it that failed for unrelated reasons — so nobody reached the cause.  Checking
  # meant opening the issue list, which is also where the noise was.
  #
  # This job answers one question — "is anything wrong, and what?" — in a single
  # job summary: every gate with its conclusion, plus the sibling nightlies
  # (registry-validation, revalidate-libs, lib-branch-report) which live in their
  # own workflows and were previously only visible by hunting through Actions.
  #
  # It reports; it does not gate.  `notify` above owns the interrupt, and only for
  # the unsound-language class.  A badge on this workflow answers the question
  # without opening anything.
  daily-status:
    name: Daily status (the one place to look)
    needs: [miri, asan, asan-leak-gate, poison, tsan, native-asan, debug-asserts, toolchain-matrix, index-hygiene, library-health]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Compose the digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # This workflow's own gates, from the needs context.
          cat > /tmp/gates.json <<'JSON'
          ${{ toJSON(needs) }}
          JSON
          {
            echo "# Daily status — $(date -u +%Y-%m-%d)"
            echo
            echo "## UB / memory-safety gates (this workflow)"
            echo
            echo "| gate | result |"
            echo "|---|---|"
            python3 - <<'PY'
          import json
          g = json.load(open('/tmp/gates.json'))
          icon = {'success': '✅', 'failure': '❌', 'cancelled': '⚠️ cancelled',
                  'skipped': '⚠️ skipped (proved nothing)'}
          for name, v in sorted(g.items()):
              r = v.get('result', '?')
              print(f"| `{name}` | {icon.get(r, r)} |")
          PY
            echo
            echo "## The other nightlies"
            echo
            echo "| workflow | latest scheduled run | when |"
            echo "|---|---|---|"
            for wf in registry-validation.yml revalidate-libs.yml lib-branch-report.yml ci.yml; do
              row=$(gh run list --repo "$REPO" --workflow "$wf" --limit 1 \
                      --json conclusion,createdAt,url \
                      --jq '"\(.[0].conclusion // "running")\t\(.[0].createdAt[0:16])\t\(.[0].url)"' 2>/dev/null || true)
              [ -z "$row" ] && { echo "| \`$wf\` | – | – |"; continue; }
              c=$(printf '%s' "$row" | cut -f1); when=$(printf '%s' "$row" | cut -f2); url=$(printf '%s' "$row" | cut -f3)
              case "$c" in success) mark="✅" ;; failure) mark="❌" ;; *) mark="⚠️ $c" ;; esac
              echo "| \`$wf\` | [$mark]($url) | $when |"
            done
            echo
            echo "_Gates that FILE an issue when red: miri, asan, poison, debug-asserts —"
            echo "the language-is-unsound class. Everything else reports here only._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest written to the job summary"
