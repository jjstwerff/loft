# Nightly REGISTRY validation — every published package against loft@main +
# current stable rustc.
#
# The chunk repos' library-ci gates their own pushes, and the registry repo's
# pr-validate gates schema + sha256 — but NOTHING re-checks a released tarball
# after loft moves.  That gap is how registry random 0.2.1 sat broken on the
# 2026.6 toolchain until a consumer hit it (loft-lang/loft-libs-core#14).
# This workflow closes it: install each package exactly as a user would
# (tarball + sha256 + dep resolution), build its native crate on current
# stable rustc, and run its shipped test suite on BOTH backends.
#
# One matrix leg per package (fail-fast off) → a red night names the exact
# packages that rotted.  Runs at 04:30 UTC, after the 03:00 full-matrix CI,
# so a red here with a green CI points at package rot, not a loft break.
name: registry-validation

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  # Called by `release-gate.yml`: one deliberate run of every nightly against ONE
  # commit, ending in one verdict (the release evidence — RELEASE.md § The nightlies).
  # A called workflow sees its CALLER's event, which is a dispatch or a probe push and
  # never `pull_request`, so it takes the same full path the schedule takes.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Coverage guard: the matrix below is built from the registry index, so a
  # package that lives in a loft-libs-* repo but was never published/indexed is
  # tested by NOTHING and no red night ever appears (how graphics-stack packages
  # sat untested).  Fail the night if any repo package is missing from the index.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every loft-libs-* package is in the nightly matrix
        env:
          GH_TOKEN: ${{ github.token }}
          # LIB_COVERAGE_IGNORE: "name1 name2"   # intentionally-unpublished packages
        run: scripts/lib_coverage_check.sh

  # Retention guard: the matrix below only ever tests versions that are STILL
  # listed, so a version deleted from the index becomes invisible to it — the
  # failure is the disappearance itself.  `web 0.2.2` was lost that way and could
  # not be restored once its release asset went with it.  Checks both directions a
  # version can stop resolving: dropped from index.json (walks its history), or
  # listed but no longer downloadable.
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every published version is still listed and still resolves
        run: scripts/registry_retention_check.py --json retention.json
      - name: Report
        if: always()
        run: |
          [ -f retention.json ] || exit 0
          {
            echo "### Registry retention"
            echo '```json'
            cat retention.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      # The step below reads the not-a-library set from `scripts/revalidate_matrix.py`,
      # which exists only in a checkout — the job used to have none (it fetches the
      # registry index with curl) and failed on the missing file every run.
      - uses: actions/checkout@v4
      - name: List registry packages
        id: list
        run: |
          set -uo pipefail
          curl -sSfL https://raw.githubusercontent.com/loft-lang/registry/main/index.json -o index.json
          # Every package with at least one non-yanked version.
          #
          # `yanked` is TYPE-COERCED here rather than trusted.  The schema says it
          # is a list, but eleven hand-published packages carried `false`, and the
          # bare `.yanked | length` died with "boolean (false) has no length" —
          # which failed `discover` in 3 seconds and SKIPPED the entire validate
          # matrix.  Every published package then went unvalidated for days while
          # the run merely looked red, so the gate was not reporting rot, it had
          # stopped looking.  A malformed field must cost us that one package, not
          # the whole sweep; loft-lang/registry's validator now rejects the bad
          # shape at the source (tools/validate.py § gate_schema).
          # …minus the packages that are not libraries.  That policy lives in
          # `scripts/revalidate_matrix.py` (`NOT_A_LIBRARY`) and is READ here rather than
          # restated: `loft` is published but is the TOOLCHAIN, so `loft install loft@X`
          # answers "`loft` is the toolchain, not a library" and the leg fails every night.
          # loft#1315 fixed exactly this drift in the revalidate-libs matrix; this workflow
          # kept its own `jq` copy of the list and so kept the bug.
          skip=$(python3 scripts/revalidate_matrix.py --not-a-library)
          packages=$(jq -c --argjson skip "$skip" '[.packages | to_entries[]
                             | select((.value.versions | keys | length)
                                      > ((.value.yanked | if type == "array" then length else 0 end)))
                             | .key | select(. as $n | ($skip | index($n)) | not)]' index.json)
          if [ -z "$packages" ] || [ "$packages" = "[]" ]; then
            echo "::error::discover produced NO packages from the registry index — refusing to report a\
           green sweep that validated nothing."
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "validating: $packages"

          # Coercing the type keeps the sweep RUNNING, but on its own it would also
          # make the defect invisible — the failure mode we just spent six nights
          # on, inverted.  So report every field the coercion had to paper over.
          # Not a hard failure: loft-lang/registry owns the data and its own
          # `tools/validate.py` rejects the bad shape at the source, and a
          # schema-only deviation that the sweep can absorb must not stop us
          # validating 34 healthy packages.  Visible, attributed, non-blocking.
          malformed=$(jq -r '[.packages | to_entries[]
                              | select((.value.yanked | type) != "array")
                              | "\(.key) → yanked = \(.value.yanked | tojson)"]
                             | join("\n")' index.json)
          if [ -n "$malformed" ]; then
            n=$(printf '%s\n' "$malformed" | wc -l)
            echo "::warning title=registry index violates its schema::$n package(s) carry a non-list \`yanked\`;\
           coerced to 0 here so the sweep can run. Fix in loft-lang/registry (index.json + re-sign)."
            {
              echo "### ⚠ registry index schema deviation"
              echo
              echo "\`yanked\` must be a list of version strings (PKG_REGISTRY.md § Yanking)."
              echo "These were coerced so the sweep could run — the data itself is still wrong:"
              echo
              echo '```'
              printf '%s\n' "$malformed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      # `mold` is loft's pinned linker.  `libasound2-dev` provides the ALSA
      # headers `alsa-sys` (a transitive native dep of the `graphics` package's
      # `rodio`) builds against — without them the graphics leg fails at native
      # crate build, not for package rot.  `xvfb` + `libgl1-mesa-dri` give a
      # headless software-GL for any package whose tests render.  Mirrors the
      # main CI Test job's Linux install so a published library validates under
      # the same provisioning its own source repo's CI had.
      - name: Install mold + ALSA + headless GL
        run: sudo apt-get update -y && sudo apt-get install -y mold libasound2-dev xvfb libgl1-mesa-dri

      - name: Update to latest stable rustc
        run: rustup update stable && rustc --version

      - name: Cache cargo registry + loft build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: registry-validation-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            registry-validation-

      - name: Build loft from main
        # `--lib --bin loft` builds BOTH: without `--lib`, libloft.rlib lands
        # only in target/release/deps/ and `loft --native` fails to resolve
        # transitive crates (E0463) — same recipe as the chunk repos'
        # library-ci.yml.
        run: |
          cargo build --release --lib --bin loft
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Validate ${{ matrix.package }}
        run: scripts/registry_validate.sh ${{ matrix.package }}
