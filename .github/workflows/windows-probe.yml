# @PLN18 / WINDOWS.md — the FOCUSED Windows probe loop (user-directed
# 2026-06-11): platform debugging iterates here — small targeted probes on
# windows-latest, fast turnaround, NOT a PR gate.  Trigger: any push to the
# `windows-probe` branch, or manual dispatch.  Delete-or-keep freely; the
# canonical findings land in doc/claude/WINDOWS.md.
name: windows-probe

on:
  push:
    branches: [windows-probe]
  # Dispatch with a filter to run ANY test on Windows, from any branch, in one command:
  #
  #   gh workflow run windows-probe.yml --ref <branch> -f tests="--test self_update_swap"
  #
  # Without this the only ways to see a Windows result were push-to-main, the nightly,
  # or adding a hardcoded step here and pushing — a 24-hour loop for a question you can
  # usually answer in minutes.  Leave `tests` empty to run the standing probes below.
  workflow_dispatch:
    inputs:
      tests:
        description: 'cargo test args (e.g. `--test self_update_swap`). Empty = standing probes.'
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  probe:
    name: Windows kernel probes
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: winprobe-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # The requested tests, when dispatched with a filter.  Standing probes are skipped
      # in that case: the point of asking is a fast answer about one thing.
      - name: Run the requested tests
        if: inputs.tests != ''
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          echo "cargo test --release $TESTS"
          cargo test --release $TESTS -- --nocapture

      - name: Run the probes
        if: inputs.tests == ''
        run: cargo test --release --test windows_probe -- --nocapture

      # Verify the platform-agnostic file://-URI abstraction on Windows: the
      # cfg(windows) branch of uri_to_path, and that the previously-hanging
      # lsp_transport tests now reply instead of timing out. A short per-test
      # terminate turns a regression (a hang) into a ~45s failure, not 600s.
      - name: Install cargo-nextest
        if: inputs.tests == ''
        uses: taiki-e/install-action@nextest
      - name: URI/path abstraction unit tests (Windows cfg)
        if: inputs.tests == ''
        run: cargo test --release --lib uri_path_tests -- --nocapture

      # Path SEPARATORS in user-facing output, the same class as the URI work above
      # and unverifiable anywhere else: on Linux a native-separator bug and a correct
      # `/` are indistinguishable, so only this leg can tell them apart.  Added after
      # the coverage report printed `src\pos.loft` on Windows against a contract that
      # says `src/pos.loft`, reddening main's Windows leg for a day with no PR able to
      # catch it (the real Windows leg runs on push-to-main and nightly only).
      - name: Report paths read the same on every platform
        if: inputs.tests == ''
        run: cargo test --release --test function_coverage -- --nocapture
      - name: LSP transport (was hanging on Windows) — must reply, not time out
        if: inputs.tests == ''
        shell: bash
        run: |
          mkdir -p .config
          cat > .config/nextest.toml <<'TOML'
          [profile.winprobe]
          slow-timeout = { period = "45s", terminate-after = 1 }
          TOML
          cargo nextest run --release --profile winprobe --test lsp_transport --no-fail-fast
