name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # scripts/make-release.sh needs `zip` to assemble the bundle; Linux also
      # needs musl-tools for the static target.  macOS ships zip already;
      # Windows runs the script under Git-Bash and gets zip from chocolatey.
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools zip

      - name: Install packaging tools (Windows)
        if: runner.os == 'Windows'
        run: choco install zip -y

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # One script builds the binary AND assembles the self-contained bundle:
      # bin/loft + default/ (the stdlib the binary loads at runtime) + examples
      # + reference PDF + stdlib.manifest + SHA256SUMS.  The native binary does
      # NOT embed the stdlib, so shipping the bare binary would be dead on
      # arrival — the bundle is the unit a programmer can actually run offline.
      - name: Build self-contained release bundle
        shell: bash
        run: scripts/make-release.sh ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loft-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.zip.sha256

  # Assemble the release as a DRAFT with all four platform bundles attached, then
  # STOP.  The owner reviews the draft and clicks Publish — and only that click
  # freezes the release (immutable releases lock assets at publish time).  The old
  # flow published FIRST (publishing the UI draft created the tag, which triggered
  # this build), so the binaries arrived AFTER the freeze and could never attach —
  # `422 Cannot upload assets to an immutable release`.  Building the draft here
  # guarantees the assets exist before the owner's publish click.  Fail-closed: if
  # any build leg fails, `needs: build` skips this job and no draft appears, so the
  # owner never ships a partial release.  See RELEASE.md § Tag & publish.
  draft-release:
    name: Assemble draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The artifact the registry entry names for the version ITSELF.  Built here
      # rather than in the build matrix because all four legs would otherwise emit the
      # same `-src.zip` and whichever uploaded last would silently win.
      - name: Build the source archive
        shell: bash
        run: |
          scripts/make-release.sh --source
          cp dist/*-src.zip dist/*-src.zip.sha256 artifacts/

      # @PLN78 1b — derive the registry entry from the artifacts this run produced.
      # Attached to the release so the entry submitted to loft-lang/registry is a file
      # taken from the release rather than a paragraph retyped per release: the hashes
      # cannot drift from the binaries they describe, because nobody copies them.
      # Verify before submitting:  sha256sum -c loft-<v>-src.zip.sha256
      - name: Generate the registry toolchain entry
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/gen-toolchain-entry.py \
            --version "$version" --dir artifacts \
            --published "$(git log -1 --format=%cI HEAD)" \
            --out "artifacts/loft-$version-registry-entry.json"

      - name: Create draft release with binaries
        uses: softprops/action-gh-release@v2
        with:
          # Never auto-publish: the owner does the final publish from the reviewed
          # draft (RELEASE.md § No Automated Releases).
          draft: true
          files: artifacts/*
          generate_release_notes: true
          # Fail loudly if the glob matches nothing (a build produced no bundle)
          # rather than silently creating an assetless draft.
          fail_on_unmatched_files: true

  docs:
    name: Deploy HTML docs to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # gendoc + the wasm builds compile Rust, which needs a linker (`ld`).
      # Unlike the build jobs (which pull binutils in via musl-tools), this job
      # installs no toolchain, so the runner had none — `cargo run` died with
      # "collect2: cannot find 'ld'".  build-essential supplies gcc + ld.
      - name: Install C toolchain (linker)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # ...and gcc then has to FIND the linker the project asks for.
      # `.cargo/config.toml` pins `-fuse-ld=mold` for x86_64-unknown-linux-gnu,
      # which this job builds — the `build` job targets musl, so it is unaffected
      # and stayed green while this one failed.
      #
      # The link line carries BOTH rustc's `-fuse-ld=lld` (with
      # `-B<sysroot>/lib/rustlib/.../bin/gcc-ld`) and our `-fuse-ld=mold`; the last
      # wins, so gcc looks for mold, finds only `ld.lld` in that `-B` directory,
      # and reports `collect2: fatal error: cannot find 'ld'`.  That message names
      # `ld`, not mold, which is why it reads as a missing toolchain — the
      # build-essential step above was added for it and did not help.  gcc falls
      # back to PATH when the `-B` directory lacks the linker, so installing mold
      # is what actually resolves it.  Every other workflow building this target
      # already does; this job was the only one that did not.
      - name: Install mold
        run: sudo apt-get install -y mold

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate HTML docs
        run: cargo run --bin gendoc

      # Always rebuild the wasm gallery bundle from the tag's source
      # before deploy — never ship whatever stale doc/pkg/ was in the
      # committed tree.  This is the primary defence against the
      # "Failed to grow table" browser error: users open gallery.html,
      # the JS glue loads loft_bg.wasm, and the two must agree.  By
      # regenerating both here we guarantee they do.
      - name: Install wasm-pack
        run: curl -sSLf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Rebuild gallery assets
        run: make gallery

      # Same story for Brick Buster: the self-contained
      # doc/brick-buster.html embeds a wasm produced by a *different*
      # pipeline (loft --html) than the wasm-pack bundle used by the
      # gallery.  Rebuild it from the tag's source so Pages never
      # ships a stale version.
      - name: Rebuild Brick Buster HTML
        run: make game

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc
          exclude_assets: 'claude/**'

  crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Skip gracefully when the token secret is unset rather than hard-failing
      # the release: a missing CARGO_REGISTRY_TOKEN should not turn the whole
      # tag run red.  cargo reads the token from CARGO_REGISTRY_TOKEN, so no
      # `--token ''` (which errors with "a value is required").
      # `cargo publish` VERIFIES by building for the host target (gnu), so it needs
      # mold for the same reason the docs job does.  This job has stayed green only
      # because the step below skips when the token is unset — it would fail on the
      # first real publish, which is the worst moment to discover it.
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          cargo publish
