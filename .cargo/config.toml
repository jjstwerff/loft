# Cargo project config.
#
# Linux x64 links through `scripts/cc-mold`, which is `cc` plus
# `-fuse-ld=mold` on machines that HAVE mold and plain `cc` on the
# ones that do not.  Nothing to install, and no setup step: the
# faster linker is used where it exists and skipped where it does
# not.
#
# This was `rustflags = ["-C", "link-arg=-fuse-ld=mold"]`, an
# unconditional demand, so a clone on a machine without mold — and
# without the root access to install it — failed to build, naming
# neither mold nor this file (loft#805):
#
#   error: linking with `cc` failed
#     = note: collect2: fatal error: cannot find 'ld'
#
# The path is relative to the directory holding `.cargo/`; cargo
# resolves `linker` against it, so it works from any cwd.
#
# - macOS / Windows: nothing.  This block targets only
#   `x86_64-unknown-linux-gnu`; other platforms ignore it and use
#   the system default linker.
# - CI: `.github/workflows/ci.yml` installs mold on the ubuntu
#   runner, so CI keeps using it; mac / windows are unaffected.
# - To use a different driver entirely, set
#   `CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER` — an env linker
#   replaces this one and nothing here needs editing.

[target.x86_64-unknown-linux-gnu]
linker = "scripts/cc-mold"

# Activates the bundled `rust-lld` linker on Windows x64 (MSVC).  The default
# `link.exe` is the slowest part of a Windows build — CI's Windows `Build` was
# ~2x the Linux `Build` (which gets `mold` above) — and it is re-paid on every
# `--native` test compile.  `rust-lld` ships with the toolchain (no install)
# and links the loft binary + ~80 deps markedly faster.
#
# VERIFY on the `windows-probe` workflow before relying on it: a wrong linker
# surfaces as LNK / rust-lld errors only at link time.  If it misbehaves on a
# given setup, comment this block out — cargo falls back to `link.exe`.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
