[package]
name = "loft-ffi-macros"
version = "0.1.0"
edition = "2024"
authors = ["Jurjen Stellingwerff"]
license = "LGPL-3.0-or-later"
description = "Proc-macro for loft native extensions: #[loft_native] generates the uniform marshal bridge (plan-25 FFI generated-dispatch)"
homepage = "https://github.com/jjstwerff/loft"
repository = "https://github.com/jjstwerff/loft"
keywords = ["loft", "ffi", "extension", "proc-macro"]
categories = ["api-bindings"]

[lib]
name = "loft_ffi_macros"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
# Integration tests apply #[loft_native] and call the generated bridge, so
# they need the LoftValue/LoftStore/LoftBridgeFn ABI from loft-ffi.
loft-ffi = { path = "../loft-ffi" }
