# cargo-nextest configuration.
#
# The `ci` profile used in .github/workflows/ci.yml tunes nextest for
# GitHub Actions: retry flaky tests once, cap parallelism to the
# runner's reported threads, and use the JUnit reporter so the
# Actions UI can surface failures.

[profile.default]
# Local runs: fail fast, no retries.
failure-output   = "immediate"
success-output   = "never"
status-level     = "pass"
# @PLAN49 T4 — kill a hung test process after 300s (terminate-after = 1 ->
# warn-and-kill at the same period).  Localizes a hung script in loft_suite
# / a hung native binary spawn / a stuck wasm build to ONE test process;
# the rest of the suite continues.  Per-process slow-timeout via nextest;
# stronger guarantee than the in-process `loft --timeout` because nextest
# escalates to SIGKILL if the process ignores SIGTERM.
slow-timeout     = { period = "300s", terminate-after = 1 }

[profile.ci]
# CI runs: retry flaky tests once, emit JUnit for the Actions UI.
retries          = 1
failure-output   = "immediate-final"
success-output   = "never"
status-level     = "pass"
final-status-level = "slow"
# @PLAN49 T4 — same slow-timeout as default; CI hosts are typically slower
# so give 600s (the long-running tests like p137_html_* + audience_crystal
# already run 60-120s on slow runners).
slow-timeout     = { period = "600s", terminate-after = 1 }

[profile.ci.junit]
path = "target/nextest/junit.xml"

# P137 / html_wasm test serialisation.
#
# Every `--html` invocation writes the generated Rust to a fixed path
# (`/tmp/loft_html.rs` / `/tmp/loft_html.wasm`) in the loft driver
# (src/main.rs:1753, 1789).  The in-process `Mutex` in
# tests/html_wasm.rs::build_lock guards parallel *threads* in one
# cargo-test process, but nextest spawns a separate process per test
# — each process has its own `OnceLock`-managed mutex, so the shared
# temp files race and one test's rustc invocation reads the partially
# overwritten intermediate source of another.  Symptoms were flaky
# "loft --html failed for …" and mismatched stdout ("sum=45" vs
# "total=60") across `p137_html_*` runs.
#
# Binding all html_wasm tests to a single-slot test-group serialises
# them at the nextest dispatcher level, crossing the process boundary
# the Rust Mutex can't.  The Mutex remains as belt-and-suspenders for
# plain `cargo test` / developer loops.
#
# Same shape applies to multiplayer_v2: every scenario binds the
# example v2 server on the fixed port 7878.  Without a single-slot
# group, two scenarios racing for bind() flake the suite.

[test-groups]
html-wasm-serial = { max-threads = 1 }
# Serialise the CPU-heavy native-build tests (each spawns many concurrent rustc)
# TOGETHER WITH the timing-sensitive networked tests (multiplayer websocket
# games), so a native rustc storm never runs alongside — and starves into an
# empty response / timeout — a server test.  Only one test from this group runs
# at a time; everything else stays fully parallel.  Subsumes the old
# `multiplayer-v2-serial`.  (The markdown viewer smoke test runs in its own
# isolated advisory job instead — see ci.yml.)
#
# multiplayer_v5 belongs here for a sharper reason than v2/v3: its `use web`
# triggers a COLD cdylib build (loft_web ~23s, a spawned `cargo build`
# grandchild) the first time it runs.  Under the full suite's build-lock
# contention that build + lock-wait can exceed the harness's 60s listen cap;
# the harness then kills the loft child, the `cargo build` grandchild SURVIVES
# holding the child's stdout pipe, and the drain-thread's `read_to_string`
# never sees EOF — a 600s terminate-after TMT.  Serialised, v5's cold build
# stays uncontended (~23s < 60s), so it never reaches that kill.  (Probe data:
# the repurposed ci-probe.yml v5-alone/v5-vs-native run, 2026-06-13.)
heavy-serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(html_wasm)'
test-group = 'html-wasm-serial'

[[profile.default.overrides]]
filter = 'binary(native) + binary(n2_cdylib) + binary(n3_parity) + binary(n3_use_native) + binary(multiplayer_v2) + binary(multiplayer_v3) + binary(multiplayer_v5)'
test-group = 'heavy-serial'

[[profile.ci.overrides]]
filter = 'binary(html_wasm)'
test-group = 'html-wasm-serial'

[[profile.ci.overrides]]
filter = 'binary(native) + binary(n2_cdylib) + binary(n3_parity) + binary(n3_use_native) + binary(multiplayer_v2) + binary(multiplayer_v3) + binary(multiplayer_v5)'
test-group = 'heavy-serial'
