#
# @P310 regression fixture — a vector<integer> argument to a vec<i64>
# FFI wrapper must lower to *const i64.  This mini-package is driven by
# `tests/codegen_emitter.rs::p310_graphics_vector_ffi_checks_clean`
# (native --check, no run).  It depends on the registry-published
# `graphics` chunk; auto-install handles fetch on first use.

[package]
name    = "p310_save_png"
version = "0.0.0"
loft    = ">=0.8"

# The lockfile pins the FULL tree (graphics 0.3.0 -> glb 0.1.0 -> mesh3d 0.1.0)
# so this codegen guard can't be broken by unrelated registry churn.  graphics
# does `use glb;` at source level, so glb resolves transitively; without a lock
# pin it floats to the latest glb, and glb-0.1.1 (republished 2026-07-18) is
# broken (`use mesh;`/`use scene;` -> Library not found, vs 0.1.0's `use mesh3d;`).
# Regenerate the lock with `loft install` ONLY after glb-0.1.1 is fixed/yanked.
[dependencies]
graphics = ">=0.1"
