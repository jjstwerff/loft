# Loft runtime log config for the TIC_TAC_TOE v2 verifier.
# All log_info / log_warn / log_error calls flush to log.txt
# (relative to this directory) per-message.  Survives abrupt
# termination — that's why we use this instead of println for
# the multi-client diagnostics.

[log]
file = log.txt
level = info
production = false
