<!DOCTYPE html>
<meta charset="utf-8">
<title>loft-gl audio bridge probe</title>
<body style="margin:0;background:#000">
<canvas id="gl" width="8" height="8"></canvas>
<pre id="out" style="color:#0f0"></pre>
<script src="/doc/loft-gl-wasm.js"></script>
<script>
// E1 — what the audio bridge PRODUCES, not what it returns.
//
// The stubs this replaces returned NUMBERS (i32::MIN / -1) and made no sound,
// which is the same shape loft#737's text stubs had: every import-shape check
// passed while nothing was audible.  So the load-bearing assertions here render
// through an OfflineAudioContext and measure SAMPLES.  A fix that returns a
// plausible handle and plays nothing still fails.
const ctrl = { ac: null, assets: {} };
// `audio_load` is synchronous and `decodeAudioData` is not, so every check here
// has to wait for the samples.  POLLING rather than sleeping a fixed 400 ms: the
// page runs a dozen renders now, and a gate that costs its own wait time twelve
// times over is one nobody keeps.  A zero-volume play is the readiness question —
// it answers -1 until the buffer lands, and contributes nothing to a render.
async function ready(g, clip) {
  for (let i = 0; i < 60; i++) {
    if (g.loft_audio_play(clip, 0, false, 0, 0) >= 0) return true;
    await new Promise(r => setTimeout(r, 20));
  }
  return false;
}
const fail = [];
function ck(name, cond, extra) {
  if (!cond) fail.push(name + (extra === undefined ? '' : ' (' + extra + ')'));
}
const mem = new WebAssembly.Memory({ initial: 4 });
const enc = new TextEncoder();
let heap = 1024;
const put = (s) => { const b = enc.encode(s); new Uint8Array(mem.buffer).set(b, heap);
                     const r = [heap, b.length]; heap += b.length + 8; return r; };
const NULL_I32 = -2147483648;

// Render one play through an offline context and hand back the peak sample.
// The bridge reuses `window._loftAudioCtx`, which is how the probe gets between
// it and the speakers without the bridge knowing.
async function peakFor(volume) {
  const off = new OfflineAudioContext(1, 22050, 22050);
  window._loftAudioCtx = off;
  const g = buildLoftImports(document.getElementById('gl'),
                             document.getElementById('out'), () => mem, ctrl).loft_gl;
  const [pp, pl] = put('/tests/data/tone440.wav');
  const clip = g.loft_audio_load(pp, pl);
  if (clip === NULL_I32 || clip < 0) return { clip, sink: -1, peak: 0 };
  // audio_load is SYNCHRONOUS and decodeAudioData is not: the handle comes back
  // now and the samples land later, so a play before the decode is expected to
  // drop.  Wait for it rather than asserting the race away.
  await ready(g, clip);
  const sink = g.loft_audio_play(clip, volume);
  const buf = await off.startRendering();
  const d = buf.getChannelData(0);
  let peak = 0;
  for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
  return { clip, sink, peak };
}

(async () => {
  try {
    // 1 — a real clip yields a real handle, and full-volume playback makes SOUND.
    const full = await peakFor(1.0);
    ck('audio_load handle', full.clip >= 0, full.clip);
    ck('audio_play sink', full.sink >= 0, full.sink);
    ck('playback has samples', full.peak > 0.1, full.peak.toFixed(4));

    // 2 — volume ATTENUATES.  Without this, a gain node that is wired but ignored
    //     passes every other check here.
    const quiet = await peakFor(0.25);
    const ratio = full.peak > 0 ? quiet.peak / full.peak : -1;
    ck('volume attenuates', ratio > 0.12 && ratio < 0.45, ratio.toFixed(3));

    // 3 — a MISSING file never becomes playable.  `audio_load` is SYNCHRONOUS and
    //     the fetch is not, so it cannot answer "absent" at call time — the
    //     contract is that the clip never arrives, so `audio_play` refuses it and
    //     the render stays silent.  This is the negative control that stops the
    //     fix from being "hand out a handle and always play".
    const offM = new OfflineAudioContext(1, 22050, 22050);
    window._loftAudioCtx = offM;
    const gM = buildLoftImports(document.getElementById('gl'),
                                document.getElementById('out'), () => mem, ctrl).loft_gl;
    const [mp, ml] = put('/tests/data/definitely_not_here.wav');
    const missing = gM.loft_audio_load(mp, ml);
    await new Promise(r => setTimeout(r, 400));   // a fixed wait: this one never lands
    const mSink = gM.loft_audio_play(missing, 1.0);
    const mBuf = await offM.startRendering();
    const mD = mBuf.getChannelData(0);
    let mPeak = 0;
    for (let i = 0; i < mD.length; i++) { const a = Math.abs(mD[i]); if (a > mPeak) mPeak = a; }
    ck('missing file refuses play', mSink < 0, mSink);
    ck('missing file is silent', mPeak === 0, mPeak);

    // 4 — stop is real: a stopped sink is not handed out again.
    const off2 = new OfflineAudioContext(1, 22050, 22050);
    window._loftAudioCtx = off2;
    const g = buildLoftImports(document.getElementById('gl'),
                               document.getElementById('out'), () => mem, ctrl).loft_gl;
    const [pp2, pl2] = put('/tests/data/tone440.wav');
    const c2 = g.loft_audio_load(pp2, pl2);
    await ready(g, c2);
    const s1 = g.loft_audio_play(c2, 1.0);
    g.loft_audio_stop(s1);
    const s2 = g.loft_audio_play(c2, 1.0);
    ck('a second play is a second sink', s2 >= 0 && s2 !== s1, s1 + '/' + s2);
    g.loft_audio_set_volume(s2, 0.5);   // must not throw
    g.loft_audio_stop(s2);

    // ── E2 — loop, pan, seek, stop-all ──────────────────────────────────
    //
    // Each is measured the way E1's checks are: RENDERED SAMPLES, and each with
    // the control that fails if the flag is ignored.  A bridge that accepts a
    // `looping` argument and drops it passes every arity check ever written.

    // Where in a rendered buffer the sound is — the only question these ask.
    function peakOf(d, from, to) {
      let p = 0;
      for (let i = Math.max(0, from | 0); i < Math.min(d.length, to | 0); i++) {
        const a = Math.abs(d[i]);
        if (a > p) p = a;
      }
      return p;
    }
    // One offline render, one clip, and whatever the caller does with the sink.
    // 22050 frames = one second, and the clips are a tenth of that, so "the tail"
    // is a real question rather than a rounding one.
    async function render(channels, file, act) {
      const off = new OfflineAudioContext(channels, 22050, 22050);
      window._loftAudioCtx = off;
      const g = buildLoftImports(document.getElementById('gl'),
                                 document.getElementById('out'), () => mem, ctrl).loft_gl;
      const [p, l] = put(file);
      const clip = g.loft_audio_load(p, l);
      await ready(g, clip);
      const sink = act(g, clip);
      const buf = await off.startRendering();
      const chans = [];
      for (let c = 0; c < channels; c++) chans.push(buf.getChannelData(c));
      return { g: g, sink: sink, chans: chans };
    }
    const TONE = '/tests/data/tone440.wav';       // 0.12 s, all sound
    const HALF = '/tests/data/half_tone.wav';     // 0.15 s silence, then 0.15 s tone

    // 5 — LOOP.  A 0.12 s clip has nothing in the last half-second of a one-second
    //     render unless it repeats.
    const looped = await render(1, TONE, (g, c) => g.loft_audio_play(c, 1.0, true, 0, 0));
    ck('a looping clip fills the tail', peakOf(looped.chans[0], 11025, 22050) > 0.1,
       peakOf(looped.chans[0], 11025, 22050).toFixed(4));
    const once = await render(1, TONE, (g, c) => g.loft_audio_play(c, 1.0, false, 0, 0));
    ck('and one that does not loop stops', peakOf(once.chans[0], 11025, 22050) === 0,
       peakOf(once.chans[0], 11025, 22050).toFixed(4));

    // 6 — PAN, at play time and while playing.  Rendered in STEREO, because the
    //     whole claim is about which side the sound comes out of.
    const left = await render(2, TONE, (g, c) => g.loft_audio_play(c, 1.0, false, -1, 0));
    ck('pan -1 is on the left', peakOf(left.chans[0], 0, 22050) > 0.1,
       peakOf(left.chans[0], 0, 22050).toFixed(4));
    ck('pan -1 is silent on the right', peakOf(left.chans[1], 0, 22050) < 0.001,
       peakOf(left.chans[1], 0, 22050).toFixed(4));
    const right = await render(2, TONE, (g, c) => g.loft_audio_play(c, 1.0, false, 1, 0));
    ck('pan 1 is on the right', peakOf(right.chans[1], 0, 22050) > 0.1,
       peakOf(right.chans[1], 0, 22050).toFixed(4));
    ck('pan 1 is silent on the left', peakOf(right.chans[0], 0, 22050) < 0.001,
       peakOf(right.chans[0], 0, 22050).toFixed(4));
    const centred = await render(2, TONE, (g, c) => g.loft_audio_play(c, 1.0, false, 0, 0));
    const cl = peakOf(centred.chans[0], 0, 22050), cr = peakOf(centred.chans[1], 0, 22050);
    ck('centre is both sides', cl > 0.1 && Math.abs(cl - cr) < 0.001, cl.toFixed(4) + '/' + cr.toFixed(4));
    const moved = await render(2, TONE, (g, c) => {
      const s = g.loft_audio_play(c, 1.0, false, 0, 0);
      g.loft_audio_set_pan(s, -1);        // …after it started
      return s;
    });
    ck('set_pan moves a sound already playing', peakOf(moved.chans[1], 0, 22050) < 0.001,
       peakOf(moved.chans[1], 0, 22050).toFixed(4));

    // 7 — START OFFSET.  The clip is silent for its first 0.15 s, so starting
    //     0.16 s in is audible IMMEDIATELY and starting at 0 is not.
    const late = await render(1, HALF, (g, c) => g.loft_audio_play(c, 1.0, false, 0, 0.16));
    ck('a late start is heard at once', peakOf(late.chans[0], 0, 441) > 0.1,
       peakOf(late.chans[0], 0, 441).toFixed(4));
    const early = await render(1, HALF, (g, c) => g.loft_audio_play(c, 1.0, false, 0, 0));
    ck('and starting at zero is not', peakOf(early.chans[0], 0, 441) === 0,
       peakOf(early.chans[0], 0, 441).toFixed(4));

    // 8 — SEEK.  Same clip, same question, but moved AFTER the sound started —
    //     which in a browser means the source is rebuilt behind the same handle.
    let seekAnswer = -1;
    const sought = await render(1, HALF, (g, c) => {
      const s = g.loft_audio_play(c, 1.0, false, 0, 0);
      seekAnswer = g.loft_audio_seek(s, 0.16);
      return s;
    });
    ck('seek answers that it moved', seekAnswer === 1, seekAnswer);
    ck('and the sound is there at once', peakOf(sought.chans[0], 0, 441) > 0.1,
       peakOf(sought.chans[0], 0, 441).toFixed(4));

    // 9 — STOP-ALL.  Two sounds, one call, and nothing left in the render.
    const stopped = await render(1, TONE, (g, c) => {
      g.loft_audio_play(c, 1.0, true, 0, 0);
      g.loft_audio_play(c, 1.0, true, 0, 0);
      g.loft_audio_stop_all();
      return 0;
    });
    ck('stop_all silences everything', peakOf(stopped.chans[0], 0, 22050) === 0,
       peakOf(stopped.chans[0], 0, 22050).toFixed(4));
    const running = await render(1, TONE, (g, c) => {
      g.loft_audio_play(c, 1.0, true, 0, 0);
      g.loft_audio_play(c, 1.0, true, 0, 0);
      return 0;
    });
    ck('…and without it they play', peakOf(running.chans[0], 0, 22050) > 0.1,
       peakOf(running.chans[0], 0, 22050).toFixed(4));

    const out = document.getElementById('out');
    if (fail.length) { console.error('AUDIO-BRIDGE FAIL: ' + fail.join(' | ')); out.textContent = 'FAIL ' + fail.join(' | '); }
    else { out.textContent = 'audio bridge ok'; }
  } catch (e) {
    console.error('AUDIO-BRIDGE THREW: ' + (e && e.stack || e));
  }
})();
</script>
