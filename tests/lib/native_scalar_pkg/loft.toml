[package]
name    = "native_scalar_pkg"
version = "0.1.0"
loft    = ">=0.1"

[library]
entry  = "src/native_scalar_pkg.loft"
native = "loft_native_scalar"

# A real `[native] crate` package: a Rust crate compiled to a cdylib and linked
# by C-ABI under `--native` (`add_native_extern_flags`).  Minimal on purpose —
# one scalar `#native` symbol — so it exercises the C-ABI exec path (and the
# Windows import-library link + DLL staging, @PLN26 phase 4) without the
# store-mutating marshalling the imaging fixture needs.
[native]
crate = "loft-native-scalar"
