[package]
name    = "p269_native_b"
version = "0.1.0"
loft    = ">=0.8"

[library]
entry = "src/p269_native_b.loft"

# A second native-crate package (alongside `imaging`) so a program importing
# both makes `native_packages.len() == 2` — the shape that used to defeat
# `backfill_native_symbol_crates`.  No #native symbols of its own; its only role
# is to be the second registered native package.  See tests/native_pkg_codegen.rs.
[native]
crate = "loft-p269-native-b"
