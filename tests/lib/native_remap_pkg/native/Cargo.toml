[package]
name    = "loft-native-remap"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"

# cdylib (the C-ABI artifact `--native` links + the interpreter dlopens) + rlib
# (the rlib path on platforms where the C-ABI path is off).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
loft-ffi = { path = "../../../../loft-ffi" }
loft-ffi-macros = { path = "../../../../loft-ffi-macros" }
