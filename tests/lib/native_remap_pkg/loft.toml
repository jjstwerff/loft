# loft#907 fixture — a `[native] crate` package whose `#native` symbols are
# implemented by DIFFERENTLY-NAMED Rust fns, the shape published libraries use
# and the one that used to make `--native` link the wrong function.  Sibling of
# `native_scalar_pkg`, which covers the clean binding; keep both, they are the
# two halves of one guard.
[package]
name    = "native_remap_pkg"
version = "0.1.0"
loft    = ">=0.1"

[library]
entry  = "src/native_remap_pkg.loft"
native = "loft_native_remap"

[native]
crate = "loft-native-remap"
