[package]
name    = "collide_a"
version = "0.1.0"
loft    = ">=0.1"

[library]
entry = "src/collide_a.loft"

# @PLN26 phase 1 regression — package A exporting `#native "collide_shared"`,
# the same symbol as collide_b.  No real cdylib: the collision is rejected at
# codegen (a compile_error in the generated Rust), before any link.
[native]
crate = "loft-collide-a"
